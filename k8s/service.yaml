apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-service
  labels:
    app: enterprise-ai
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: enterprise-ai
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-nodeport
  labels:
    app: enterprise-ai
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: enterprise-ai
